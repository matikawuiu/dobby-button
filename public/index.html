<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Разбуди Доббу</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .button {
      padding: 1.5rem 3rem;
      font-size: 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .button:active {
      transform: scale(0.98);
    }
    #result {
      margin-top: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-weight: bold;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div id="app">
    <input type="password" id="passwordInput" placeholder="Пароль" style="margin-bottom: 1rem; padding: 0.5rem; border-radius: 25px; border: 1px solid #ddd; font-size: 1rem;">
    <button class="button" id="wakeButton">Разбудить Доббу</button>
    <div id="result"></div>
  </div>

  <script>
    const button = document.getElementById('wakeButton');
    const result = document.getElementById('result');

    button.addEventListener('click', async () => {
      if (!confirm('Точно разбудить?')) {
        return;
      }

      result.textContent = 'Отправляю...';
      result.className = '';

      try {
        const response = await fetch('/api/wake', { 
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ 
            password: document.getElementById('passwordInput').value 
          })
        });

        const data = await response.json();

        if (response.ok) {
          result.textContent = 'Добба разбужен ✅';
          result.className = 'success';
        } else if (response.status === 401) {
          result.textContent = 'Неверный пароль';
          result.className = 'error';
        } else {
          result.textContent = `Ошибка: ${data.body}`;
          result.className = 'error';
        }
      } catch (err) {
        result.textContent = 'Ошибка сети: ' + err.message;
        result.className = 'error';
      }
    });
  </script>
</body>
</html>
